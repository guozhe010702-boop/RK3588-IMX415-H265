<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790" role="img" aria-labelledby="title desc">
<title id="title">RK3588 项目：视频、控制与文件三条链路</title><desc id="desc">视频通过 FFmpeg 和 MediaMTX，控制通过 SSH 与 Unix socket，文件通过独立 SFTP 连接。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#466b84"/></marker></defs>
<rect width="1240" height="790" rx="18" fill="#f4f8fb"/>
<style>text{font-family:"Microsoft YaHei",sans-serif;fill:#17364a}.title{font-size:25px;font-weight:700}.sub{font-size:16px;fill:#516d81}.label{font-size:18px;font-weight:600}.tiny{font-size:14px;fill:#516d81}path.flow{stroke:#466b84;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
<text x="32" y="42" class="title">程序总图：画面、命令、文件分别走哪条路</text>
<text x="32" y="71" class="sub">相机只采集、编码一次；播放、录像和截图读取同一条 RTSP 流。</text>
<text x="32" y="114" class="label">① 视频数据：板端编码 → RTSP 分发 → 各端解码或封装</text><rect x="32" y="136" width="258" height="76" rx="10" fill="#e0f0fa" stroke="#a2bed0"/><text x="161.0" y="165" text-anchor="middle" class="label">IMX415 / con7</text><text x="161.0" y="191" text-anchor="middle" class="tiny">传感器 → CSI / ISP</text><rect x="327" y="136" width="258" height="76" rx="10" fill="#e0f0fa" stroke="#a2bed0"/><text x="456.0" y="165" text-anchor="middle" class="label">V4L2 /dev/video44</text><text x="456.0" y="191" text-anchor="middle" class="tiny">NV12M 两平面原始图像</text><rect x="622" y="136" width="258" height="76" rx="10" fill="#e0f0fa" stroke="#a2bed0"/><text x="751.0" y="165" text-anchor="middle" class="label">FFmpeg / VPU</text><text x="751.0" y="191" text-anchor="middle" class="tiny">hevc_rkmpp 或 h264_rkmpp</text><rect x="917" y="136" width="258" height="76" rx="10" fill="#e0f0fa" stroke="#a2bed0"/><text x="1046.0" y="165" text-anchor="middle" class="label">MediaMTX</text><text x="1046.0" y="191" text-anchor="middle" class="tiny">RTSP TCP · 8554/imx415</text><path class="flow" d="M290,174 H327"/><path class="flow" d="M585,174 H622"/><path class="flow" d="M880,174 H917"/><rect x="32" y="261" width="258" height="76" rx="10" fill="#e4f4eb" stroke="#a2bed0"/><text x="161.0" y="290" text-anchor="middle" class="label">开发板 HDMI</text><text x="161.0" y="316" text-anchor="middle" class="tiny">系统 ffplay 读取 RTSP</text><rect x="327" y="261" width="258" height="76" rx="10" fill="#e4f4eb" stroke="#a2bed0"/><text x="456.0" y="290" text-anchor="middle" class="label">Windows 实时预览</text><text x="456.0" y="316" text-anchor="middle" class="tiny">VideoWorker → 最新帧 → Qt</text><rect x="622" y="261" width="258" height="76" rx="10" fill="#e4f4eb" stroke="#a2bed0"/><text x="751.0" y="290" text-anchor="middle" class="label">MP4 录像</text><text x="751.0" y="316" text-anchor="middle" class="tiny">FFmpeg copy → 封口验证</text><rect x="917" y="261" width="258" height="76" rx="10" fill="#e4f4eb" stroke="#a2bed0"/><text x="1046.0" y="290" text-anchor="middle" class="label">JPEG 截图</text><text x="1046.0" y="316" text-anchor="middle" class="tiny">FFmpeg 读取 RTSP 解码一帧</text><path class="flow" d="M1046,212 V237 H161 V261"/><path class="flow" d="M456,237 V261"/><path class="flow" d="M751,237 V261"/><path class="flow" d="M1046,237 V261"/><text x="32" y="384" class="label">② 控制命令：电脑按钮 → SSH CLI → 本机 socket → 常驻 Controller</text><rect x="32" y="408" width="258" height="76" rx="10" fill="#fff0dd" stroke="#a2bed0"/><text x="161.0" y="437" text-anchor="middle" class="label">MainWindow</text><text x="161.0" y="463" text-anchor="middle" class="tiny">layout 组装界面 / window 编排</text><rect x="327" y="408" width="258" height="76" rx="10" fill="#fff0dd" stroke="#a2bed0"/><text x="456.0" y="437" text-anchor="middle" class="label">SSHWorker</text><text x="456.0" y="463" text-anchor="middle" class="tiny">后台串行队列 · SSH 22</text><rect x="622" y="408" width="258" height="76" rx="10" fill="#fff0dd" stroke="#a2bed0"/><text x="751.0" y="437" text-anchor="middle" class="label">avctl.py / cli</text><text x="751.0" y="463" text-anchor="middle" class="tiny">stdin JSON → Unix socket</text><rect x="917" y="408" width="258" height="76" rx="10" fill="#fff0dd" stroke="#a2bed0"/><text x="1046.0" y="437" text-anchor="middle" class="label">Controller 服务</text><text x="1046.0" y="463" text-anchor="middle" class="tiny">拥有采集、录像、HDMI 子进程</text><path class="flow" d="M290,446 H327"/><path class="flow" d="M585,446 H622"/><path class="flow" d="M880,446 H917"/><text x="32" y="518" class="sub">状态响应沿原路返回；Controller 在板端常驻。CLI 每次调用只发送请求，不另开摄像头。</text><text x="32" y="564" class="label">③ 文件下载：板端已完成文件 → 独立 SFTP → 临时文件 → 校验后发布</text><rect x="32" y="588" width="258" height="76" rx="10" fill="#ede8fa" stroke="#a2bed0"/><text x="161.0" y="617" text-anchor="middle" class="label">板端文件</text><text x="161.0" y="643" text-anchor="middle" class="tiny">recordings/ 与 snapshots/</text><rect x="327" y="588" width="258" height="76" rx="10" fill="#ede8fa" stroke="#a2bed0"/><text x="456.0" y="617" text-anchor="middle" class="label">FileWorker</text><text x="456.0" y="643" text-anchor="middle" class="tiny">独立 SSH / SFTP 连接</text><rect x="622" y="588" width="258" height="76" rx="10" fill="#ede8fa" stroke="#a2bed0"/><text x="751.0" y="617" text-anchor="middle" class="label">电脑 .part 文件</text><text x="751.0" y="643" text-anchor="middle" class="tiny">长度、SHA-256 与写盘检查</text><rect x="917" y="588" width="258" height="76" rx="10" fill="#ede8fa" stroke="#a2bed0"/><text x="1046.0" y="617" text-anchor="middle" class="label">电脑最终文件</text><text x="1046.0" y="643" text-anchor="middle" class="tiny">媒体列表 / 本地 MP4 回放</text><path class="flow" d="M290,626 H327"/><path class="flow" d="M585,626 H622"/><path class="flow" d="M880,626 H917"/><text x="32" y="711" class="sub">方案网页：refresh_status.ps1 → board_status.js → 浏览器显示采样状态；没有直接 SSH 或 RTSP 预览。</text><text x="32" y="747" class="sub">学习代码：GStreamer 编号脚本、MPP C API 保留供对照；当前桌面产品链路不调用它们。</text></svg>